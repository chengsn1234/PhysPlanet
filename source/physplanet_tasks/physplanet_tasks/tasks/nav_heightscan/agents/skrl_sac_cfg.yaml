seed: 42

models:
  policy:
    initial_log_std: -1.0
    min_log_std: -5.0
    max_log_std: 1.0
    network:
      - layers: [256, 160, 128]
        activations: leaky_relu
  critic:
    network:
      - layers: [256, 160, 128]
        activations: leaky_relu

memory:
  total_size: 200000
  device: cpu

agent:
  class: SAC
  gradient_steps: 1
  batch_size: 256
  discount_factor: 0.99
  polyak: 0.005
  learning_rate: 3.0e-4
  random_timesteps: 5000
  learning_starts: 5000
  grad_norm_clip: 1.0
  learn_entropy: true
  initial_entropy_value: 0.2
  experiment:
    directory: ""
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  timesteps: 1000000
  environment_info: log
