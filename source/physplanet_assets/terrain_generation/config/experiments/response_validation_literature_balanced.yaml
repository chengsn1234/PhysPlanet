# Controlled wheel-terrain response experiment with response-balanced
# intermediate values. All bands share appearance, semantic label, rigid
# friction and geometry; the intermediate n0/phi values are chosen from the
# bounded literature interval to make the measured response more evenly spaced.

terrain_name: "experiments/response_validation_literature_balanced"
sky: mars

hm: 99
terrain_size: 24.0
terrain_height: 0.0001
terrain_downsample: 4
gt_resolution: 0.05

rock_k: 0.0
rock_seed: 42
rock_sizes: []
rock_downsample: 32

